name: Update departures
on:
  schedule:
    - cron: "30 3 * * *"     # daily, 03:30 UTC
  workflow_dispatch:           # "Run workflow" button for testing
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSL -o gtfs-nl.zip http://gtfs.ovapi.nl/nl/gtfs-nl.zip
      - run: python3 ferry_timetable.py gtfs-nl.zip 7
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add departures.json
          git diff --cached --quiet || git commit -m "Update departures"
          git push
